# Documentation site only — no website, API server or database.
#
# Usage (run from the repository root):
#   Prod: docker compose --profile prod up --build
#   Dev:  docker compose --profile dev up
#
# Ports:
#   prod http://localhost:3000  (DOCS_PORT)
#   dev  http://localhost:3000  (DOCS_DEV_PORT)
#
# The two profiles are mutually exclusive because they share port 3000 by
# default. Override DOCS_PORT or DOCS_DEV_PORT to run them side by side.

name: skygenesisenterprise-docs

x-dev: &dev
  image: node:24.4-alpine
  working_dir: /app
  init: true
  environment:
    PNPM_HOME: /pnpm
    PATH: /pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    CI: "true"
  volumes:
    # Application source — hot reload for the docs site.
    - .:/app
    # Keep container dependencies out of the host tree.
    - docs-node-modules:/app/node_modules
    # Persist the pnpm store between container runs.
    - pnpm-store:/pnpm/store

services:
  # --- production ----------------------------------------------------------
  docs:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    image: skygenesisenterprise/docs:${TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "${DOCS_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/docs/core",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --- development ---------------------------------------------------------
  docs-dev:
    <<: *dev
    profiles: ["dev"]
    command: >-
      sh -lc "npm install -g pnpm@12.16.1 &&
      pnpm install --frozen-lockfile &&
      pnpm exec next dev --port 3000 --hostname 0.0.0.0"
    ports:
      - "${DOCS_DEV_PORT:-3000}:3000"

volumes:
  docs-node-modules:
  pnpm-store:
  